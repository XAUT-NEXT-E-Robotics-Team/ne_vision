<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Auto Neko Web Console =^._.^=</title>\n    <style>\n        body {\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            background-color: #1e1e1e;\n            color: #fff;\n            margin: 0;\n            padding: 20px;\n        }\n        .container {\n            display: flex;\n            gap: 20px;\n            max-width: 1400px;\n            margin: 0 auto;\n        }\n        .panel {\n            background-color: #2d2d2d;\n            padding: 20px;\n            border-radius: 8px;\n            box-shadow: 0 4px 6px rgba(0,0,0,0.3);\n            flex: 1;\n        }\n        #video_feed {\n            width: 100%;\n            border: 2px solid #4CAF50;\n            border-radius: 4px;\n        }\n        textarea {\n            width: 100%;\n            height: 600px;\n            background: #1e1e1e;\n            color: #00ff00;\n            font-family: monospace;\n            padding: 10px;\n            border: 1px solid #555;\n            border-radius: 4px;\n            box-sizing: border-box;\n        }\n        button {\n            background-color: #4CAF50;\n            color: white;\n            border: none;\n            padding: 10px 20px;\n            font-size: 16px;\n            border-radius: 4px;\n            cursor: pointer;\n            margin-top: 10px;\n            width: 100%;\n        }\n        button:hover { background-color: #45a049; }\n        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }\n        .status { padding: 5px 10px; border-radius: 4px; font-weight: bold; }\n        .connected { background: #4CAF50; }\n        .disconnected { background: #f44336; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <!-- Video Panel -->\n        <div class=\"panel\">\n            <div class=\"header\">\n                <h2>ZMQ Debug Stream</h2>\n                <span id=\"ws-status\" class=\"status disconnected\">Disconnected</span>\n            </div>\n            <img id=\"video_feed\" src=\"\" alt=\"Waiting for ZMQ stream...\" />\n        </div>\n\n        <!-- Config Panel -->\n        <div class=\"panel\">\n            <div class=\"header\">\n                <h2>Config.yaml Editor</h2>\n            </div>\n            <textarea id=\"config-editor\">Loading config...</textarea>\n            <button id=\"save-btn\" onclick=\"saveConfig()\">Save & Restart AutoAim</button>\n        </div>\n    </div>\n\n    <script>\n        // 1. WebSocket for Video\n        const ws = new WebSocket(`ws://${window.location.host}/ws/video`);\n        const img = document.getElementById('video_feed');\n        const status = document.getElementById('ws-status');\n\n        ws.onopen = () => { status.textContent = 'Connected'; status.className = 'status connected'; };\n        ws.onclose = () => { status.textContent = 'Disconnected'; status.className = 'status disconnected'; };\n        ws.onmessage = (event) => {\n            const url = URL.createObjectURL(event.data);\n            img.onload = () => URL.revokeObjectURL(url);\n            img.src = url;\n        };\n\n        // 2. Fetch YAML Config\n        fetch('/api/config')\n            .then(res => res.text())\n            .then(text => document.getElementById('config-editor').value = text);\n\n        // 3. Save YAML Config\n        async function saveConfig() {\n            const btn = document.getElementById('save-btn');\n            const text = document.getElementById('config-editor').value;\n            btn.textContent = 'Saving...';\n            btn.style.background = '#ffa500';\n            \n            try {\n                const response = await fetch('/api/config', { method: 'POST', body: text });\n                const data = await response.json();\n                \n                if (data.status === 'success') {\n                    btn.textContent = 'Saved & Restarting...';\n                    setTimeout(() => { btn.textContent = 'Save & Restart AutoAim'; btn.style.background = '#4CAF50'; }, 2000);\n                } else {\n                    throw new Error(data.message);\n                }\n            } catch (e) {\n                alert('Save failed: ' + e.message);\n                btn.textContent = 'Save & Restart AutoAim';\n                btn.style.background = '#4CAF50';\n            }\n        }\n    </script>\n</body>\n</html>\n
